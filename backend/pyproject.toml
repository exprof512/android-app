[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "foodai-backend"
version = "0.1.0"
description = "FoodAI backend foundation"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "arq>=0.26",
    "asyncpg>=0.30",
    "boto3>=1.35",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "openai>=1.60",
    "pillow>=10.4",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "redis>=5.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["app*"]
