name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: foodai
          POSTGRES_PASSWORD: foodai
          POSTGRES_DB: foodai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://foodai:foodai@localhost:5432/foodai
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-signing-key-with-more-than-32-characters
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      - name: Migrations against Postgres
        run: alembic upgrade head
      - name: Tests
        run: python -m pytest -q
      # Known reflection noise (DESC indexes, JSON variants) is tracked in
      # docs/phase-17-report.md; keep it visible without blocking the build.
      - name: Schema drift (informational)
        continue-on-error: true
        run: alembic check

  android:
    name: Android (unit tests + APK)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # The runner image ships the Android SDK; setup-android@v3 fails on the
      # forced Node 24 runtime, so use the preinstalled SDK instead.
      - name: Android SDK info
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -z "${ANDROID_HOME:-}" ] && [ -d "$SDK" ]; then
            echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_HOME=$SDK"
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true
          if [ ! -d "$SDK/platforms/android-35" ]; then
            SDKM="$(find "$SDK" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | head -1)"
            if [ -n "$SDKM" ]; then
              yes | "$SDKM" --licenses > /dev/null 2>&1 || true
              "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
            fi
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Gradle version
        run: ./gradlew --version
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload Android reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
